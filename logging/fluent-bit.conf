[SERVICE]
    Flush                1
    Log_Level            info

[INPUT]
    Name                 tail
    Path                 /var/log/containers/*_sql-lab_*.log
    Path_Key             source_file
    Tag                  sql-lab
    DB                   /state/tail.db
    Read_from_Head       On
    Refresh_Interval     5
    Skip_Long_Lines      On
    Mem_Buf_Limit        16MB
    multiline.parser     docker, cri

[OUTPUT]
    Name                 es
    Match                sql-lab
    Host                 elasticsearch
    Port                 9200
    Logstash_Format      On
    Logstash_Prefix      sql-lab
    Suppress_Type_Name   On
    Generate_ID          On
    Retry_Limit          False
