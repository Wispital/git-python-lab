apiVersion: v1
kind: Service
metadata:
  name: line-counter-api
spec:
  selector:
    app: line-counter-api
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: line-counter-api
spec:
  selector:
    matchLabels:
      app: line-counter-api
  template:
    metadata:
      labels:
        app: line-counter-api
    spec:
      containers:
        - name: api
          image: git-python-lab:web
          imagePullPolicy: Never
          command: ["python", "api.py"]
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
          env:
            - name: PGHOST
              value: postgres
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: postgres-login
                  key: POSTGRES_DB
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-login
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-login
                  key: POSTGRES_PASSWORD
