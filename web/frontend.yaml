apiVersion: v1
kind: Service
metadata:
  name: line-counter-web
spec:
  selector:
    app: line-counter-web
  ports:
    - port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: line-counter-web
spec:
  selector:
    matchLabels:
      app: line-counter-web
  template:
    metadata:
      labels:
        app: line-counter-web
    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
          volumeMounts:
            - name: web-content
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
      volumes:
        - name: web-content
          configMap:
            name: line-counter-web-content
        - name: nginx-config
          configMap:
            name: line-counter-nginx-config
